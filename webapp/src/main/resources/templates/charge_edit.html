<!DOCTYPE html>
<html th:replace="~{layout/app :: layout(${isAddMode}?'料金新規追加':'料金編集', ~{::content}, 'charge')}"
xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="content">
    <!--/*
        料金情報編集画面
    */-->
    <div th:if="!${#strings.isEmpty(message)}" class="alert alert-success">
        <span th:text="${message}"></span>
    </div>
    <form th:action="${isAddMode}?@{/charge/add}:@{/charge/update}" th:object="${charge}" method="POST">
      <input type="hidden" th:field="*{chargeId}"/>
          <div class="mb-3 row">
            <label class="col-sm-2 col-form-label" for="name">料金名</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" th:field="*{name}" maxlength="64">
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-2 col-form-label" for="amount">料金</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" th:field="*{amount}">
                <span class="text-danger" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-2 col-form-label" for="startDate">適用開始日</label>
            <div class="col-sm-10">
                <input type="date" class="form-control" th:field="*{startDate}" name="joining_date">
                <span class="text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span>
            </div>
        </div>
        <div class="mb-3 row">
            <label class="col-sm-2 col-form-label" for="endDate">適用終了日</label>
            <div class="col-sm-10">
                <input type="date" class="form-control" th:field="*{endDate}">
                <span class="text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span>
            </div>
        </div>
        <div class="mb-3 row justify-content-between">
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn btn-secondary" th:href="@{/charge/search}">キャンセル</a>
            </div>
            <div class="col-auto">
                <div th:if="!${isAddMode}">
                    <a class=" btn btn-danger" id="delete" th:href="@{/charge/delete/{id}(id=*{chargeId})}"
                        style="background-color: red;">削除</a>
                </div>
            </div>
        </div>
    </form>
    <script th:inline="javascript">
        /**
            削除ボタンがクリックされた時の制御
        */
        // HTMLが読込まれたら実行する関数を登録
        document.addEventListener("DOMContentLoaded", (e) => {
            // idがdeleteのHTML要素(削除ボタン)を取得
            const deleteBtn = document.getElementById("delete");
            // 取得した要素がクリックされた時に実行される関数を登録。
            deleteBtn.addEventListener("click", (e) => {
                // 確認画面を表示
                let result = confirm("id:[[${charge.chargeId}]]を削除してもよろしいですか？");
                if (!result) {
                    // もし、キャンセルが押されたら、クリックされた要素動作を取りやめる
                    e.preventDefault();
                }
                return result;
            });
        });
    </script>
</div>

</html>
