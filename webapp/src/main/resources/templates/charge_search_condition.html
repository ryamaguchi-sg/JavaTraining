<!DOCTYPE html>
<html th:replace="~{layout/app :: layout('料金検索', ~{::content}, 'charge')}"
xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
     
<div th:fragment="content">
  <!--/* 料金情報検索画面 */-->
  <form method="POST" th:object="${chargeSearchCondition}">
    <!--/* 料金名 */-->
    <div class="mb-3 row">
      <label class="col-sm-2 col-form-label" for="name">料金名</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:field="*{name}" />
      </div>
    </div>

    <!-- 並び替え項目と並び順 -->
      <div class="mb-3 row">
        <label class="col-sm-2 col-form-label" for="sortKey">並び替え</label>
        <div class="col-sm-3">
            <select th:field="*{sortKey}" class="form-select">
          <option value="chargeId">料金ID</option>
          <option value="name">料金名</option>
          <option value="amount">料金</option>
          <option value="startDate">適用開始日</option>
          <option value="endDate">適用終了日</option>
        </select>
        </div>

        <div class="col-sm-3">
            <select th:field="*{orderDirection}" class="form-select">
          <option value="asc">昇順</option>
                  <option value="desc">降順</option>
         </select>
         </div>

       </div>
    
    
    <!--/* ここにテキストフォームを設置 */-->
    <div class="mb-3 row justify-content-between">

        <div class="mb-3 d-flex gap-2">

        <button type="submit" class="btn btn-primary" formaction="/charge/search">検索</button>
        <a class="btn btn-link" th:href="@{/charge/add}">登録</a>
        </div>
      </div>
  </form>
</div>


</html>
