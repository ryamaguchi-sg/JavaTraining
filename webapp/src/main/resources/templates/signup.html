<!DOCTYPE html>
<html th:replace="~{layout/app :: layout('管理者新規追加', ~{::content}, 'signup')}"
xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="content">
    <!--/*
        管理者情報登録画面
    */-->
    <div th:if="!${#strings.isEmpty(message)}" class="alert alert-success">
        <span th:text="${message}"></span>
    </div>
    <form th:action="@{/login/signup}" th:object="${account}" method="POST">
        <div class="mb-3 row">
          <label class="col-sm-2 col-form-label" for="name">ユーザ名</label>
          <div class="col-sm-10">
            <input class="form-control" type="text" name="name" />
          </div>
        </div>
        <div class="mb-3 row">
          <label class="col-sm-2 col-form-label" for="password">パスワード</label>
          <div class="col-sm-10">
            <input class="form-control" type="password" name="password" required />
          </div>
        </div>

        <div class="mb-3 row justify-content-between">
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">登録</button>
                <a class="btn btn-secondary" th:href="@{/login}">キャンセル</a>
            </div>
        </div>
    </form>
    <script th:inline="javascript">
      </script>
</div>

</html>
